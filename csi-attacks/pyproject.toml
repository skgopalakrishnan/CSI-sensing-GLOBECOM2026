[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csi-attacks"
version = "0.1.0"
description = "Adversarial attacks for CSI-based WiFi sensing models"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Shreevanth Krishnaa Gopalakrishnan" }, { name = "Stephen Hailes" }]
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "torch>=2.0",
]

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.7",
  "ptflops>=0.7",
]
test = [
  "pytest>=7.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["csi*"]
namespaces = true
