[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csi-defenses"
version = "0.1.0"
description = "Methods to defend CSI ML models against adversarial attacks"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Shreevanth Krishnaa Gopalakrishnan" }, { name = "Stephen Hailes" }]
license = { text = "MIT" }
dependencies = [
  "torch>=2.0",
  "scipy>=1.7",
]

[project.optional-dependencies]
test = [
  "pytest>=7.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["csi*"]
namespaces = true
