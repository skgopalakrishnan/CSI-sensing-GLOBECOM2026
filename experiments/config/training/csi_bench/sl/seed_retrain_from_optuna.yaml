# Retrain tie-broken Optuna params across multiple seeds (CSI-Bench domain)
common:
  experiment_name: csi-bench-optuna-seed-retrain

selection:
  # Overwritten by job script parameter line.
  summary_json: experiments/metadata/optuna_selection/csi_bench_optuna_tiebreak_summary.json

export:
  enabled: true
  clean_weights_dir_name: model_params_optuna_tiebreak_seed42
  canonical_seed: 42
  latest_alias: true

run:
  domain: csi_bench
  seeds: [11, 23, 37, 42, 53]
  deterministic: false
  require_test_split: true
  continue_on_error: false
  # Optional filters:
  # include_models: [CSITimeSformer]
  # include_tasks: [HumanActivityRecognition]

data:
  device: cuda
  dataset_root: datasets/CSI-Bench
  batch_size: 256
  normalisation: zscore
  splits_dir: splits
  target_subcarriers: 56
  target_timesteps: 250
  only_splits: [train_id, val_id, test_id]

training:
  learning_rate: 0.001
  epochs: 80
  progress_bar: false
  patience: 15
  min_epochs: 10
  monitor_metric: loss
  min_delta: 0.0005
  weight_decay: 0.0005
  grad_clip: null
  amp: true
  amp_dtype: float16
  log_every_epochs: 5
  optimizer:
    type: adamw
  scheduler:
    type: cosine_warmup
    warmup_epochs: 5
