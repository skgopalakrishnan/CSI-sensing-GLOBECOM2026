common:
  experiment_name: clean-model-eval
  seed: 42

run:
  targets: [ntu, csi_bench]

model:
  architectures: [MLP, ResNet18, LeNet, BiLSTM, CSITimeSformer]

data:
  device: cuda
  seed: 42

performance:
  tf32: true
  matmul_precision: high

weights:
  selection: auto
  strict_load: true
  ntu:
    datasets_root: datasets
    weights_dir_names: [model_params_optuna_tiebreak_seed42]
  csi_bench:
    dataset_root: datasets/CSI-Bench
    weights_dir_names: [model_params_optuna_tiebreak_seed42]

ntu:
  root: datasets
  datasets: [NTU-Fi_HAR, NTU-Fi-HumanID]
  task: classification
  timesteps: 250
  base_normalisation: none
  canon_normalisation: per_subcarrier
  variant: raw
  batch_sizes:
    train: 32
    test: 128
  augment: {}
  eval_splits: [val, test]

csi_bench:
  dataset_root: datasets/CSI-Bench
  task_names: [HumanActivityRecognition, HumanIdentification]
  batch_size: 256
  normalisation: zscore
  splits_dir: splits
  target_subcarriers: 56
  target_timesteps: 250
  eval_split_names: [test_id, test_cross_user, test_cross_env, test_cross_device]
